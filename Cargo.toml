[package]
name = "tpt-app-git-simple"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "engine", "desktop"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pro edition (paid desktop build): plain-language save (commit), get latest
# (pull), push, guided conflict resolution, and reflog-backed safe undo. The
# free WASM build compiles without it; `--features pro` is Pro.
pro = ["tpt-git-engine/pro"]

[dependencies]
tpt-appfront-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-core" }
tpt-appfront-dom = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-dom" }
tpt-git-engine = { path = "engine" }
# Pinned to the installed wasm-bindgen CLI version — the CLI rejects wasm
# built against a different schema version. Bump both together.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Location",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlHeadElement",
    "CssStyleDeclaration",
    "HtmlCollection",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "MouseEvent",
    "DomRect",
    "File",
    "FileList",
] }
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop shell is a native binary; keep its codegen normal even in the
# same workspace (the `release` profile above applies to the wasm lib build).
[profile.release.package.tpt-git-simple-pro]
opt-level = 3
